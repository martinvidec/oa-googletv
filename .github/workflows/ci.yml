name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: AGENTS.md und CLAUDE.md vorhanden
        run: |
          test -f AGENTS.md
          test -f CLAUDE.md
      - name: YAML-Validierung (Templates + Workflows)
        run: |
          python3 - <<'PYEOF'
          import glob, sys
          import yaml
          bad = []
          for pattern in ("ISSUE_TEMPLATE/*.yml", "workflows/*.yml"):
              for p in glob.glob(".github/" + pattern):
                  try:
                      yaml.safe_load(open(p))
                  except Exception as e:
                      bad.append("%s: %s" % (p, e))
          if bad:
              print("\n".join(bad))
              sys.exit(1)
          print("YAML OK")
          PYEOF

  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Gradle-Wrapper erzeugen (falls nicht eingecheckt)
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.11.1 --distribution-type bin
          fi
      - name: assembleDebug
        run: ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
